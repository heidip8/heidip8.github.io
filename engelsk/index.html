<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engelsk - Tips og triks</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <!-- Navigasjon / Tilbakeknapp -->
        <nav class="mb-8">
            <a href="../index.html" class="inline-flex items-center text-sm font-semibold text-slate-600 hover:text-sky-600 bg-white hover:bg-sky-50 border border-slate-200 px-4 py-2 rounded-xl transition shadow-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Tilbake til hovedmeny
            </a>
        </nav>

        <!-- Overskrift og intro -->
        <header class="mb-10 text-center md:text-left flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <div class="inline-flex items-center space-x-2 text-sky-600 font-semibold text-sm mb-1">
                    <i class="fa-solid fa-language"></i>
                    <span>Fagressurser</span>
                </div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Engelsk</h1>
                <p class="text-slate-600 mt-2">Utforsk spill, vokabular, grammatikk og interaktive læringsverktøy.</p>
            </div>

            <!-- Søkefelt -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Søk i engelskverktøy..." onkeyup="filterTools()" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent shadow-sm">
            </div>
        </header>

        <!-- Grid med Engelsk-verktøy -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="toolsGrid">

            <!-- Hot Seat verktøykort -->
            <div class="tool-card bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition" data-title="hot seat engelsk spill ord øving vokabular">
                <div>
                    <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900 mb-2">Hot Seat</h2>
                    <p class="text-slate-500 text-sm mb-4">Engasjerende ordspill for å øve på vokabular og forklare engelske begreper.</p>
                </div>
                <a href="hotseat.html" class="inline-flex items-center justify-center w-full px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-sm transition whitespace-nowrap">
                    <span>Åpne verktøy</span>
                    <i class="fa-solid fa-arrow-right ml-2 text-xs flex-shrink-0"></i>
                </a>
            </div>

        </div>

        <!-- Ingen resultater melding -->
        <div id="noResults" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-200 mt-4">
            <i class="fa-solid fa-magnifying-glass text-4xl text-slate-300 mb-3"></i>
            <h3 class="text-lg font-bold text-slate-700">Ingen verktøy funnet</h3>
            <p class="text-slate-500 text-sm mt-1">Prøv et annet søkeord.</p>
        </div>
    </div>

    <!-- Søkefunksjonalitet -->
    <script>
        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.tool-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const title = card.getAttribute('data-title').toLowerCase();
                if (title.includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            const noResults = document.getElementById('noResults');
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
